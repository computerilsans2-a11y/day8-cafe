<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>리뷰 · 골목카페</title>
<style>
  /* 디자인 기준(모든 페이지 공통): 흰 바탕 + 1px 얇은 선 + 무채색 투명도 회색 + 파랑 하나. 그림자·이모지 없음. */
  :root {
    --bg: #ffffff;
    --bg-soft: rgba(0, 0, 0, 0.04);
    --bg-tag: rgba(0, 0, 0, 0.06);
    --line: rgba(0, 0, 0, 0.11);
    --line-input: rgba(0, 0, 0, 0.18);
    --text: rgba(0, 0, 0, 0.85);
    --text-sub: rgba(0, 0, 0, 0.6);
    --text-hint: rgba(0, 0, 0, 0.45);
    --text-disabled: rgba(0, 0, 0, 0.25);
    --brand: #1890ff;
    --brand-dark: #096dd9;
    --danger: #ff4d4f;
    --danger-text: #f5222d;
    --tag-blue-bg: #d5e7f7;
    --tag-blue-text: #32587c;
    --font: Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Helvetica Neue", "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    --ease: cubic-bezier(0.31, 0.27, 0.15, 0.99);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 28px;
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.6;
    color: var(--text);
    background: var(--bg);
  }
  h1 { margin: 0 0 2px; font-size: 22px; font-weight: 600; line-height: 1.4; }
  .sub { margin: 0 0 20px; color: var(--text-sub); }

  #msg { margin: 0 0 16px; padding: 12px 16px; border-radius: 4px; background: var(--bg-soft); }
  #msg:empty { display: none; }
  #msg.error { color: var(--danger-text); }

  .review { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 16px 20px; margin-bottom: 12px; }
  .head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 8px; }
  .stars { color: var(--text); font-size: 16px; letter-spacing: 1px; }
  .stars .off { color: var(--line-input); }
  .date { color: var(--text-hint); font-size: 13px; }
  .tag { display: inline-block; height: 24px; line-height: 24px; padding: 0 8px; border-radius: 4px; font-size: 13px; background: var(--bg-tag); color: var(--text-sub); }
  .tag.positive { background: var(--tag-blue-bg); color: var(--tag-blue-text); }
  .tag.negative { color: var(--danger-text); font-weight: 600; }
  .head .spacer { flex: 1; }
  .content { margin: 0 0 12px; font-size: 15px; white-space: pre-wrap; }

  .reply-box { border-top: 1px solid var(--line); padding-top: 12px; }
  .reply-box label { display: block; font-size: 13px; color: var(--text-sub); margin-bottom: 6px; }
  textarea {
    width: 100%; min-height: 84px; resize: vertical;
    font: inherit; color: var(--text); line-height: 1.6;
    padding: 8px 12px; border: 1px solid var(--line-input); border-radius: 4px; background: var(--bg);
    transition: border-color 0.1s var(--ease);
  }
  textarea:focus { outline: none; border-color: var(--brand); }
  .row { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
  .status { color: var(--text-hint); font-size: 13px; }
  button {
    font: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    height: 36px; padding: 0 16px; border: 0; border-radius: 6px;
    background: var(--brand); color: #fff;
    transition: background 0.1s var(--ease);
  }
  button:hover { background: var(--brand-dark); }
  button.ghost { background: var(--bg); color: var(--text); border: 1px solid var(--line-input); }
  button.ghost:hover { background: var(--bg-soft); }
  button:disabled { background: var(--bg-tag); color: var(--text-disabled); border-color: transparent; cursor: default; }
  .empty { color: var(--text-sub); padding: 16px 8px; }

  @media (max-width: 600px) {
    body { padding: 16px; }
  }
</style>
</head>
<body>
<h1>리뷰</h1>
<p class="sub">"AI 분석"을 누르면 손님의 감정을 읽고 사장님 답글 초안을 만들어 저장합니다. 답글은 고친 뒤 "답글 저장"으로 다시 저장할 수 있습니다.</p>
<p id="msg"></p>
<div id="list"></div>
<div id="empty" class="empty" style="display:none">아직 리뷰가 없습니다.</div>

<script>
  var SUPABASE_URL = "https://aygdylhsmzevjrybnozf.supabase.co";
  var SUPABASE_KEY = "sb_publishable_EHyev6fOsOQbrASk6X79vw_uJh4dKcY";
  var AI_URL = SUPABASE_URL + "/functions/v1/cafe-ai";
  var KST_OFFSET = 9 * 60 * 60 * 1000;     // 한국 시간(UTC+9)

  var SENTIMENT_LABEL = { positive: "좋음", neutral: "보통", negative: "아쉬움" };

  // 왼쪽 메뉴(index.html)에서 고른 AI 모델. 고른 적이 없으면 그 메뉴의 기본값과 같은 모델을 쓴다.
  var DEFAULT_MODEL = "google/gemma-4-31b-it:free";
  function selectedModel() {
    try { return localStorage.getItem("cafe-ai-model") || DEFAULT_MODEL; } catch (e) { return DEFAULT_MODEL; }
  }

  var listEl = document.getElementById("list");
  var emptyEl = document.getElementById("empty");
  var msgEl = document.getElementById("msg");

  // 서버·네트워크 오류를 사장님이 알아들을 수 있는 문장으로 바꾼다. (5개 페이지 공통)
  function friendly(err, fallback) {
    var m = (err && err.message) || "";
    if (err instanceof TypeError || /Failed to fetch|NetworkError|Load failed/i.test(m)) {
      return "인터넷 연결을 확인해 주세요.";
    }
    if (/429|모든 모델|바쁩/.test(m)) {
      return "AI가 지금 바쁩니다. 잠시 후 다시 눌러 주세요.";
    }
    if (/[가-힣]/.test(m) && m.length < 80 && !/[{}]|https?:|PGRST|JWT/.test(m)) { return m; }
    return fallback;
  }

  function headers() {
    return {
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json"
    };
  }

  // 응답을 JSON으로 읽고, 실패하면 서버가 보낸 안내 문구를 오류로 던진다.
  function readJson(res) {
    return res.text().then(function (t) {
      var data = null;
      try { data = t ? JSON.parse(t) : null; } catch (e) { data = null; }
      if (!res.ok) {
        throw new Error((data && (data.error || data.message)) || t || res.statusText);
      }
      return data;
    });
  }

  function db(path, options) {
    options = options || {};
    options.headers = Object.assign(headers(), options.headers || {});
    return fetch(SUPABASE_URL + "/rest/v1/" + path, options).then(readJson);
  }

  function say(text, isError) {
    msgEl.textContent = text || "";
    msgEl.className = isError ? "error" : "";
  }

  function el(tag, props, children) {
    var e = document.createElement(tag);
    Object.keys(props || {}).forEach(function (k) { e[k] = props[k]; });
    (children || []).forEach(function (c) { e.appendChild(c); });
    return e;
  }

  // 작성 시각을 한국 시간으로 "2026.10.11 17:52" 형태로 보여 준다.
  function formatDate(iso) {
    var s = new Date(Date.parse(iso) + KST_OFFSET).toISOString();
    return s.slice(0, 10).replace(/-/g, ".") + " " + s.slice(11, 16);
  }

  function stars(n) {
    var box = el("span", { className: "stars", title: "별점 " + n + "점" });
    for (var i = 1; i <= 5; i++) {
      box.appendChild(el("span", { className: i <= n ? "" : "off", textContent: "★" }));
    }
    return box;
  }

  function renderReview(r) {
    var card = el("div", { className: "review" });

    var badge = el("span", { className: "tag" });
    function showBadge() {
      if (r.sentiment && SENTIMENT_LABEL[r.sentiment]) {
        badge.className = "tag " + r.sentiment;
        badge.textContent = SENTIMENT_LABEL[r.sentiment];
        badge.style.display = "";
      } else {
        badge.style.display = "none";
      }
    }
    showBadge();

    var aiBtn = el("button", { type: "button", textContent: r.reply ? "다시 분석" : "AI 분석" });
    var head = el("div", { className: "head" }, [
      stars(r.rating),
      el("span", { className: "date", textContent: formatDate(r.written_at) }),
      badge,
      el("span", { className: "spacer" }),
      aiBtn
    ]);

    var content = el("p", { className: "content", textContent: r.content });

    var textarea = el("textarea", { placeholder: "\"AI 분석\"을 누르면 답글 초안이 여기에 들어옵니다." });
    textarea.value = r.reply || "";
    var status = el("span", { className: "status" });
    var saveBtn = el("button", { type: "button", className: "ghost", textContent: "답글 저장" });
    var replyBox = el("div", { className: "reply-box" }, [
      el("label", { textContent: "사장님 답글" }),
      textarea,
      el("div", { className: "row" }, [saveBtn, status])
    ]);

    card.appendChild(head);
    card.appendChild(content);
    card.appendChild(replyBox);

    function flash(text) {
      status.textContent = text;
      if (text) { setTimeout(function () { status.textContent = ""; }, 2500); }
    }

    function save(fields) {
      return db("reviews?id=eq." + r.id, {
        method: "PATCH",
        headers: { "Prefer": "return=minimal" },
        body: JSON.stringify(fields)
      });
    }

    aiBtn.addEventListener("click", function () {
      // 이미 쓴 답글이 있으면 AI 답글로 바꿀지 먼저 묻는다.
      if (textarea.value.trim() &&
          !window.confirm("잠깐! 이미 작성한 답글이 있습니다.\nAI가 만든 답글로 바꾸시겠습니까?")) {
        return;
      }
      aiBtn.disabled = true;
      var before = aiBtn.textContent;
      aiBtn.textContent = "분석 중";
      status.textContent = "AI가 리뷰를 읽고 있습니다. 최대 1분 정도 걸릴 수 있습니다.";
      say("");

      fetch(AI_URL, {
        method: "POST",
        headers: headers(),
        body: JSON.stringify({ type: "review", rating: r.rating, content: r.content, model: selectedModel() })
      }).then(readJson).then(function (ai) {
        if (!ai || !SENTIMENT_LABEL[ai.sentiment_code] || !ai.reply) {
          throw new Error("AI 답변을 읽지 못했습니다.");
        }
        return save({ sentiment: ai.sentiment_code, reply: ai.reply }).then(function () {
          r.sentiment = ai.sentiment_code;
          r.reply = ai.reply;
          textarea.value = ai.reply;
          showBadge();
          aiBtn.textContent = "다시 분석";
          flash("분석 결과를 저장했습니다. (" + ai.model + ")");
        });
      }).catch(function (err) {
        aiBtn.textContent = before;
        status.textContent = "";
        say("AI 분석에 실패했습니다. " + friendly(err, "잠시 후 다시 눌러 주세요."), true);
      }).then(function () {
        aiBtn.disabled = false;
      });
    });

    saveBtn.addEventListener("click", function () {
      var reply = textarea.value.trim();
      saveBtn.disabled = true;
      save({ reply: reply || null }).then(function () {
        r.reply = reply || null;
        textarea.value = reply;
        aiBtn.textContent = r.reply ? "다시 분석" : "AI 분석";
        flash("답글을 저장했습니다.");
      }).catch(function (err) {
        say("답글을 저장하지 못했습니다. " + friendly(err, "잠시 후 다시 시도해 주세요."), true);
      }).then(function () {
        saveBtn.disabled = false;
      });
    });

    return card;
  }

  function load() {
    return db("reviews?select=*&order=written_at.desc").then(function (list) {
      list = list || [];
      listEl.innerHTML = "";
      list.forEach(function (r) { listEl.appendChild(renderReview(r)); });
      emptyEl.style.display = list.length ? "none" : "block";
    }).catch(function (err) {
      say("리뷰를 불러오지 못했습니다. " +
        friendly(err, "화면을 새로고침한 뒤 다시 시도해 주세요."), true);
    });
  }

  load();
</script>
</body>
</html>
