<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>매출 · 골목카페</title>
<style>
  :root {
    --bg: #fbf6ef;
    --panel: #ffffff;
    --side: #4a2f1f;
    --side-text: #f3e6d6;
    --accent: #c97b3c;
    --text: #2d1f16;
    --muted: #8a7566;
    --line: #e8dccd;
    --font: "Pretendard", "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", sans-serif;
    --danger: #b3402a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 28px;
    font-family: var(--font);
    color: var(--text);
    background: var(--bg);
  }
  .wrap { max-width: 1000px; }
  h1 { margin: 0 0 4px; font-size: 24px; }
  .sub { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 20px; }
  .box h2 { margin: 0 0 14px; font-size: 17px; }

  form { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
  label { display: flex; flex-direction: column; font-size: 13px; color: var(--muted); gap: 4px; }
  input, select {
    font: inherit; color: var(--text);
    padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff;
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #f-menu { width: 260px; }
  #f-qty { width: 100px; }
  button {
    font: inherit; font-weight: 700; cursor: pointer;
    padding: 10px 18px; border: 0; border-radius: 8px; background: var(--accent); color: #fff;
  }
  button:disabled { opacity: .6; cursor: default; }
  .preview { align-self: center; color: var(--muted); font-size: 14px; }
  .preview b { color: var(--text); }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
  .card .label { color: var(--muted); font-size: 14px; }
  .card .value { font-size: 28px; font-weight: 700; margin-top: 6px; }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); font-size: 15px; }
  th { color: var(--muted); font-size: 13px; font-weight: 500; }
  th.num, td.num { text-align: right; }
  .gone { color: var(--muted); }
  .empty { color: var(--muted); padding: 18px 8px; }
  #msg { min-height: 20px; margin: 0 0 12px; font-size: 14px; }
  #msg.error { color: var(--danger); }
  #stock-note { color: var(--danger); font-size: 13px; }

  @media (max-width: 600px) {
    body { padding: 16px; }
    #f-menu, #f-qty { width: 100%; }
    label { width: 100%; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>매출</h1>
  <p class="sub" id="today-label"></p>
  <p id="msg"></p>

  <div class="box">
    <h2>판매 입력</h2>
    <form id="sale-form">
      <label>메뉴
        <select id="f-menu" required></select>
      </label>
      <label>수량
        <input id="f-qty" type="number" min="1" step="1" value="1" required>
      </label>
      <span class="preview" id="preview"></span>
      <button type="submit" id="sale-btn">판매 입력</button>
    </form>
    <div id="no-menu" class="empty" style="display:none">판매할 메뉴가 없습니다. 먼저 '메뉴' 화면에서 메뉴와 재고를 등록해 주세요.</div>
  </div>

  <div class="cards">
    <div class="card"><div class="label">오늘 판매 건수</div><div class="value" id="sum-count">0건</div></div>
    <div class="card"><div class="label">오늘 판매 수량</div><div class="value" id="sum-qty">0개</div></div>
    <div class="card"><div class="label">오늘 매출 합계</div><div class="value" id="sum-amount">₩0</div></div>
  </div>

  <div class="box">
    <h2>오늘 판매 목록</h2>
    <table>
      <thead>
        <tr><th>시각</th><th>메뉴</th><th class="num">수량</th><th class="num">금액</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty" class="empty" style="display:none">오늘 판매 내역이 아직 없습니다.</div>
  </div>
</div>

<script>
  var SUPABASE_URL = "https://aygdylhsmzevjrybnozf.supabase.co";
  var SUPABASE_KEY = "sb_publishable_EHyev6fOsOQbrASk6X79vw_uJh4dKcY";

  var menuSel = document.getElementById("f-menu");
  var qtyEl = document.getElementById("f-qty");
  var previewEl = document.getElementById("preview");
  var msgEl = document.getElementById("msg");
  var menus = [];

  function api(path, options) {
    options = options || {};
    options.headers = Object.assign({
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json"
    }, options.headers || {});
    return fetch(SUPABASE_URL + "/rest/v1/" + path, options).then(function (res) {
      return res.text().then(function (t) {
        var data = null;
        try { data = t ? JSON.parse(t) : null; } catch (e) { data = null; }
        if (!res.ok) {
          // 서버가 보낸 한글 안내(예: 재고 부족)가 있으면 그대로 보여 준다.
          throw new Error((data && data.message) || t || res.statusText);
        }
        return data;
      });
    });
  }

  function say(text, isError) {
    msgEl.textContent = text || "";
    msgEl.className = isError ? "error" : "";
  }

  function won(n) { return "₩" + Number(n).toLocaleString("ko-KR"); }

  function el(tag, props, children) {
    var e = document.createElement(tag);
    Object.keys(props || {}).forEach(function (k) { e[k] = props[k]; });
    (children || []).forEach(function (c) { e.appendChild(c); });
    return e;
  }

  function startOfToday() {
    var d = new Date();
    d.setHours(0, 0, 0, 0);
    return d.toISOString();
  }

  function selectedMenu() {
    return menus.filter(function (m) { return String(m.id) === menuSel.value; })[0];
  }

  function updatePreview() {
    var m = selectedMenu();
    var q = Number(qtyEl.value);
    if (!m) { previewEl.textContent = ""; return; }
    qtyEl.max = m.stock;
    previewEl.innerHTML = "";
    if (Number.isInteger(q) && q > 0) {
      previewEl.appendChild(document.createTextNode("금액 "));
      previewEl.appendChild(el("b", { textContent: won(m.price * q) }));
    }
    previewEl.appendChild(document.createTextNode(" · 남은 재고 " + m.stock + "개"));
  }

  function loadMenus() {
    var keep = menuSel.value;
    return api("menus?select=id,name,price,stock&order=id.asc").then(function (list) {
      menus = list;
      menuSel.innerHTML = "";
      list.forEach(function (m) {
        var label = m.name + " · " + won(m.price) + (m.stock <= 0 ? " (품절)" : " · 재고 " + m.stock);
        var opt = el("option", { value: m.id, textContent: label });
        if (m.stock <= 0) { opt.disabled = true; }
        menuSel.appendChild(opt);
      });
      var hasMenu = list.length > 0;
      document.getElementById("no-menu").style.display = hasMenu ? "none" : "block";
      document.getElementById("sale-form").style.display = hasMenu ? "flex" : "none";
      if (keep && list.some(function (m) { return String(m.id) === keep && m.stock > 0; })) {
        menuSel.value = keep;
      } else {
        var first = list.filter(function (m) { return m.stock > 0; })[0];
        if (first) { menuSel.value = first.id; }
      }
      updatePreview();
    });
  }

  function loadToday() {
    var path = "sales?select=id,quantity,amount,sold_at,menus(name)" +
               "&sold_at=gte." + encodeURIComponent(startOfToday()) + "&order=sold_at.desc";
    return api(path).then(function (list) {
      var rows = document.getElementById("rows");
      rows.innerHTML = "";
      var count = 0, qty = 0, amount = 0;
      list.forEach(function (s) {
        count += 1; qty += s.quantity; amount += s.amount;
        var t = new Date(s.sold_at);
        var time = ("0" + t.getHours()).slice(-2) + ":" + ("0" + t.getMinutes()).slice(-2);
        var nameCell = s.menus && s.menus.name
          ? el("td", { textContent: s.menus.name })
          : el("td", { className: "gone", textContent: "(삭제된 메뉴)" });
        rows.appendChild(el("tr", {}, [
          el("td", { textContent: time }),
          nameCell,
          el("td", { className: "num", textContent: s.quantity + "개" }),
          el("td", { className: "num", textContent: won(s.amount) })
        ]));
      });
      document.getElementById("empty").style.display = list.length ? "none" : "block";
      document.getElementById("sum-count").textContent = count + "건";
      document.getElementById("sum-qty").textContent = qty + "개";
      document.getElementById("sum-amount").textContent = won(amount);
    });
  }

  function refresh() {
    return Promise.all([loadMenus(), loadToday()]).catch(function (err) {
      say("불러오지 못했습니다: " + err.message, true);
    });
  }

  menuSel.addEventListener("change", updatePreview);
  qtyEl.addEventListener("input", updatePreview);

  document.getElementById("sale-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var m = selectedMenu();
    var q = Number(qtyEl.value);
    if (!m) { say("메뉴를 골라 주세요.", true); return; }
    if (!Number.isInteger(q) || q < 1) { say("수량은 1 이상의 정수로 입력해 주세요.", true); return; }
    if (q > m.stock) { say("재고가 부족합니다. (남은 재고 " + m.stock + "개)", true); return; }

    var btn = document.getElementById("sale-btn");
    btn.disabled = true;
    // 판매 기록과 재고 차감은 서버 함수 하나가 한 번에 처리한다.
    api("rpc/record_sale", {
      method: "POST",
      body: JSON.stringify({ p_menu_id: m.id, p_quantity: q })
    }).then(function () {
      say(m.name + " " + q + "개 판매를 입력했습니다. (" + won(m.price * q) + ")");
      qtyEl.value = 1;
      return refresh();
    }).catch(function (err) {
      say("판매를 입력하지 못했습니다: " + err.message, true);
      return refresh();
    }).then(function () {
      btn.disabled = false;
    });
  });

  var days = ["일", "월", "화", "수", "목", "금", "토"];
  var now = new Date();
  document.getElementById("today-label").textContent =
    now.getFullYear() + "년 " + (now.getMonth() + 1) + "월 " + now.getDate() + "일 (" + days[now.getDay()] + ") 오늘 장사";

  refresh();
</script>
</body>
</html>
