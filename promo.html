<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>홍보 · 골목카페</title>
<style>
  :root {
    --bg: #fbf6ef;
    --panel: #ffffff;
    --side: #4a2f1f;
    --side-text: #f3e6d6;
    --accent: #c97b3c;
    --text: #2d1f16;
    --muted: #8a7566;
    --line: #e8dccd;
    --font: "Pretendard", "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", sans-serif;
    --danger: #b3402a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 28px;
    font-family: var(--font);
    color: var(--text);
    background: var(--bg);
  }
  .wrap { max-width: 1000px; }
  h1 { margin: 0 0 4px; font-size: 24px; }
  .sub { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 20px; }
  .box h2 { margin: 0 0 14px; font-size: 17px; }
  #msg { min-height: 20px; margin: 0 0 12px; font-size: 14px; }
  #msg.error { color: var(--danger); }

  form { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; }
  .field { display: flex; flex-direction: column; font-size: 13px; color: var(--muted); gap: 6px; }
  select {
    font: inherit; color: var(--text);
    padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; width: 240px;
  }
  select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  .moods { display: flex; gap: 8px; }
  .moods label { cursor: pointer; }
  .moods input { position: absolute; opacity: 0; pointer-events: none; }
  .moods span {
    display: inline-block; padding: 9px 16px; border: 1px solid var(--line); border-radius: 999px;
    background: #fff; color: var(--text); font-size: 15px;
  }
  .moods input:checked + span { background: var(--side); border-color: var(--side); color: #fff; font-weight: 700; }
  .moods input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

  button {
    font: inherit; font-weight: 700; cursor: pointer;
    padding: 10px 18px; border: 0; border-radius: 8px; background: var(--accent); color: #fff;
  }
  button.ghost { background: #fff; color: var(--text); border: 1px solid var(--line); padding: 7px 14px; }
  button:disabled { opacity: .6; cursor: default; }

  .caption { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 12px; }
  .caption .no { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
  .caption p { margin: 0 0 12px; font-size: 16px; line-height: 1.7; white-space: pre-wrap; }
  .model { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .empty { color: var(--muted); padding: 18px 8px; }

  @media (max-width: 600px) {
    body { padding: 16px; }
    select { width: 100%; }
    .field { width: 100%; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>홍보</h1>
  <p class="sub">메뉴와 분위기를 고르면 SNS에 올릴 홍보 문구 3개를 만들어 줍니다.</p>
  <p id="msg"></p>

  <div class="box">
    <h2>문구 만들기</h2>
    <form id="promo-form">
      <label class="field">메뉴
        <select id="f-menu" required></select>
      </label>
      <div class="field">분위기
        <div class="moods" id="moods">
          <label><input type="radio" name="mood" value="따뜻하게" checked><span>따뜻하게</span></label>
          <label><input type="radio" name="mood" value="재미있게"><span>재미있게</span></label>
          <label><input type="radio" name="mood" value="짧게"><span>짧게</span></label>
        </div>
      </div>
      <button type="submit" id="go-btn">문구 만들기</button>
    </form>
  </div>

  <div id="result"></div>
  <div id="hint" class="empty">메뉴와 분위기를 고르고 "문구 만들기"를 눌러 보세요.</div>
</div>

<script>
  var SUPABASE_URL = "https://aygdylhsmzevjrybnozf.supabase.co";
  var SUPABASE_KEY = "sb_publishable_EHyev6fOsOQbrASk6X79vw_uJh4dKcY";
  var AI_URL = SUPABASE_URL + "/functions/v1/cafe-ai";

  // 화면의 짧은 말 → AI에게 보내는 설명
  var MOOD_TEXT = {
    "따뜻하게": "따뜻하고 포근한",
    "재미있게": "재미있고 유쾌한",
    "짧게": "아주 짧고 간결한 (문구마다 한 문장, 25자 안팎)"
  };

  // 왼쪽 메뉴(index.html)에서 고른 AI 모델. 고른 적이 없으면 그 메뉴의 기본값과 같은 모델을 쓴다.
  var DEFAULT_MODEL = "google/gemma-4-31b-it:free";
  function selectedModel() {
    try { return localStorage.getItem("cafe-ai-model") || DEFAULT_MODEL; } catch (e) { return DEFAULT_MODEL; }
  }

  var menuSel = document.getElementById("f-menu");
  var resultEl = document.getElementById("result");
  var hintEl = document.getElementById("hint");
  var msgEl = document.getElementById("msg");
  var goBtn = document.getElementById("go-btn");

  function headers() {
    return {
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json"
    };
  }

  function readJson(res) {
    return res.text().then(function (t) {
      var data = null;
      try { data = t ? JSON.parse(t) : null; } catch (e) { data = null; }
      if (!res.ok) {
        throw new Error((data && (data.error || data.message)) || t || res.statusText);
      }
      return data;
    });
  }

  function say(text, isError) {
    msgEl.textContent = text || "";
    msgEl.className = isError ? "error" : "";
  }

  function el(tag, props, children) {
    var e = document.createElement(tag);
    Object.keys(props || {}).forEach(function (k) { e[k] = props[k]; });
    (children || []).forEach(function (c) { e.appendChild(c); });
    return e;
  }

  // 복사: 가능하면 클립보드 API, 막혀 있으면 임시 입력칸으로 대신한다.
  function copyText(text) {
    function fallback() {
      var ta = el("textarea", { value: text });
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      return ok ? Promise.resolve() : Promise.reject(new Error("복사하지 못했어요."));
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).catch(fallback);
    }
    return fallback();
  }

  function renderCaptions(captions, model) {
    resultEl.innerHTML = "";
    captions.forEach(function (text, i) {
      var btn = el("button", { type: "button", className: "ghost", textContent: "복사" });
      btn.addEventListener("click", function () {
        copyText(text).then(function () {
          say("");
          btn.textContent = "복사됨 ✓";
          setTimeout(function () { btn.textContent = "복사"; }, 1500);
        }).catch(function (err) {
          say(err.message, true);
        });
      });
      resultEl.appendChild(el("div", { className: "caption" }, [
        el("div", { className: "no", textContent: "문구 " + (i + 1) }),
        el("p", { textContent: text }),
        btn
      ]));
    });
    resultEl.appendChild(el("div", { className: "model", textContent: "만든 AI: " + model }));
  }

  function loadMenus() {
    return fetch(SUPABASE_URL + "/rest/v1/menus?select=id,name&order=id.asc", { headers: headers() })
      .then(readJson)
      .then(function (list) {
        menuSel.innerHTML = "";
        list.forEach(function (m) {
          menuSel.appendChild(el("option", { value: m.name, textContent: m.name }));
        });
        if (!list.length) {
          menuSel.appendChild(el("option", { value: "", textContent: "등록된 메뉴가 없어요" }));
          goBtn.disabled = true;
          say("먼저 '메뉴' 화면에서 메뉴를 등록해 주세요.", true);
        }
      })
      .catch(function (err) {
        say("메뉴를 불러오지 못했습니다: " + err.message, true);
        goBtn.disabled = true;
      });
  }

  document.getElementById("promo-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var menu = menuSel.value;
    var mood = document.querySelector('input[name="mood"]:checked').value;
    if (!menu) { say("메뉴를 골라 주세요.", true); return; }

    goBtn.disabled = true;
    goBtn.textContent = "만드는 중…";
    say("AI가 문구를 쓰고 있어요. 최대 1분쯤 걸릴 수 있어요.");
    hintEl.style.display = "none";

    fetch(AI_URL, {
      method: "POST",
      headers: headers(),
      body: JSON.stringify({ type: "promo", menu: menu, mood: MOOD_TEXT[mood], model: selectedModel() })
    }).then(readJson).then(function (ai) {
      if (!Array.isArray(ai.captions) || ai.captions.length < 3) {
        throw new Error("AI 응답 형식이 올바르지 않아요.");
      }
      renderCaptions(ai.captions, ai.model);
      say("");
    }).catch(function (err) {
      say("문구를 만들지 못했습니다: " + err.message, true);
      if (!resultEl.children.length) { hintEl.style.display = ""; }
    }).then(function () {
      goBtn.disabled = false;
      goBtn.textContent = "문구 만들기";
    });
  });

  loadMenus();
</script>
</body>
</html>
