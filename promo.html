<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>홍보 · 골목카페</title>
<style>
  /* 디자인 기준(모든 페이지 공통): 흰 바탕 + 1px 얇은 선 + 무채색 투명도 회색 + 파랑 하나. 그림자·이모지 없음. */
  :root {
    --bg: #ffffff;
    --bg-soft: rgba(0, 0, 0, 0.04);
    --bg-tag: rgba(0, 0, 0, 0.06);
    --line: rgba(0, 0, 0, 0.11);
    --line-input: rgba(0, 0, 0, 0.18);
    --text: rgba(0, 0, 0, 0.85);
    --text-sub: rgba(0, 0, 0, 0.6);
    --text-hint: rgba(0, 0, 0, 0.45);
    --text-disabled: rgba(0, 0, 0, 0.25);
    --brand: #1890ff;
    --brand-dark: #096dd9;
    --danger: #ff4d4f;
    --danger-text: #f5222d;
    --font: Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Helvetica Neue", "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    --ease: cubic-bezier(0.31, 0.27, 0.15, 0.99);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 28px;
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.6;
    color: var(--text);
    background: var(--bg);
  }
  h1 { margin: 0 0 2px; font-size: 22px; font-weight: 600; line-height: 1.4; }
  .sub { margin: 0 0 20px; color: var(--text-sub); }
  .box { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 16px 20px; margin-bottom: 20px; }
  .box h2 { margin: 0 0 14px; font-size: 16px; font-weight: 600; line-height: 1.4; }

  #msg { margin: 0 0 16px; padding: 12px 16px; border-radius: 4px; background: var(--bg-soft); }
  #msg:empty { display: none; }
  #msg.error { color: var(--danger-text); }

  form { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; }
  .field { display: flex; flex-direction: column; font-size: 13px; color: var(--text-sub); gap: 6px; }
  select {
    font: inherit; color: var(--text);
    height: 40px; padding: 0 12px; width: 240px;
    border: 1px solid var(--line-input); border-radius: 6px; background: var(--bg);
    transition: border-color 0.1s var(--ease);
  }
  select:focus { outline: none; border-color: var(--brand); }

  /* 분위기 선택: 선 있는 칩, 선택하면 파랑 테두리와 글자 */
  .moods { display: flex; gap: 8px; }
  .moods label { cursor: pointer; }
  .moods input { position: absolute; opacity: 0; pointer-events: none; }
  .moods span {
    display: inline-block; height: 40px; line-height: 38px; padding: 0 16px;
    border: 1px solid var(--line-input); border-radius: 6px;
    background: var(--bg); color: var(--text); font-size: 14px;
    transition: border-color 0.1s var(--ease), background 0.1s var(--ease);
  }
  .moods label:hover span { background: var(--bg-soft); }
  .moods input:checked + span { border-color: var(--brand); color: var(--brand); font-weight: 600; }
  .moods input:focus-visible + span { border-color: var(--brand); }

  button {
    font: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    height: 40px; padding: 0 20px; border: 0; border-radius: 6px;
    background: var(--brand); color: #fff;
    transition: background 0.1s var(--ease);
  }
  button:hover { background: var(--brand-dark); }
  button.ghost { background: var(--bg); color: var(--text); border: 1px solid var(--line-input); height: 36px; padding: 0 14px; }
  button.ghost:hover { background: var(--bg-soft); }
  button:disabled { background: var(--bg-tag); color: var(--text-disabled); border-color: transparent; cursor: default; }

  .caption { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 16px 20px; margin-bottom: 12px; }
  .caption .no { color: var(--text-hint); font-size: 13px; margin-bottom: 4px; }
  .caption p { margin: 0 0 12px; font-size: 15px; white-space: pre-wrap; }
  .model { color: var(--text-hint); font-size: 12px; margin-top: 4px; }
  .empty { color: var(--text-sub); padding: 16px 8px; }

  @media (max-width: 600px) {
    body { padding: 16px; }
    select { width: 100%; }
    .field { width: 100%; }
  }
</style>
</head>
<body>
<h1>홍보</h1>
<p class="sub">메뉴와 분위기를 고르면 SNS에 올릴 홍보 문구 3개를 만들어 줍니다.</p>
<p id="msg"></p>

<div class="box">
  <h2>문구 만들기</h2>
  <form id="promo-form">
    <label class="field">메뉴
      <select id="f-menu" required></select>
    </label>
    <div class="field">분위기
      <div class="moods" id="moods">
        <label><input type="radio" name="mood" value="따뜻하게" checked><span>따뜻하게</span></label>
        <label><input type="radio" name="mood" value="재미있게"><span>재미있게</span></label>
        <label><input type="radio" name="mood" value="짧게"><span>짧게</span></label>
      </div>
    </div>
    <button type="submit" id="go-btn">문구 만들기</button>
  </form>
</div>

<div id="result"></div>
<div id="hint" class="empty">메뉴와 분위기를 고른 뒤 "문구 만들기"를 눌러 주세요.</div>

<script>
  var SUPABASE_URL = "https://aygdylhsmzevjrybnozf.supabase.co";
  var SUPABASE_KEY = "sb_publishable_EHyev6fOsOQbrASk6X79vw_uJh4dKcY";
  var AI_URL = SUPABASE_URL + "/functions/v1/cafe-ai";

  // 화면의 짧은 말 → AI에게 보내는 설명
  var MOOD_TEXT = {
    "따뜻하게": "따뜻하고 포근한",
    "재미있게": "재미있고 유쾌한",
    "짧게": "아주 짧고 간결한 (문구마다 한 문장, 25자 안팎)"
  };

  // 왼쪽 메뉴(index.html)에서 고른 AI 모델. 고른 적이 없으면 그 메뉴의 기본값과 같은 모델을 쓴다.
  var DEFAULT_MODEL = "google/gemma-4-31b-it:free";
  function selectedModel() {
    try { return localStorage.getItem("cafe-ai-model") || DEFAULT_MODEL; } catch (e) { return DEFAULT_MODEL; }
  }

  var menuSel = document.getElementById("f-menu");
  var resultEl = document.getElementById("result");
  var hintEl = document.getElementById("hint");
  var msgEl = document.getElementById("msg");
  var goBtn = document.getElementById("go-btn");

  // 서버·네트워크 오류를 사장님이 알아들을 수 있는 문장으로 바꾼다. (5개 페이지 공통)
  function friendly(err, fallback) {
    var m = (err && err.message) || "";
    if (err instanceof TypeError || /Failed to fetch|NetworkError|Load failed/i.test(m)) {
      return "인터넷 연결을 확인해 주세요.";
    }
    if (/429|모든 모델|바쁩/.test(m)) {
      return "AI가 지금 바쁩니다. 잠시 후 다시 눌러 주세요.";
    }
    if (/[가-힣]/.test(m) && m.length < 80 && !/[{}]|https?:|PGRST|JWT/.test(m)) { return m; }
    return fallback;
  }

  function headers() {
    return {
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json"
    };
  }

  function readJson(res) {
    return res.text().then(function (t) {
      var data = null;
      try { data = t ? JSON.parse(t) : null; } catch (e) { data = null; }
      if (!res.ok) {
        throw new Error((data && (data.error || data.message)) || t || res.statusText);
      }
      return data;
    });
  }

  function say(text, isError) {
    msgEl.textContent = text || "";
    msgEl.className = isError ? "error" : "";
  }

  function el(tag, props, children) {
    var e = document.createElement(tag);
    Object.keys(props || {}).forEach(function (k) { e[k] = props[k]; });
    (children || []).forEach(function (c) { e.appendChild(c); });
    return e;
  }

  // 복사: 가능하면 클립보드 API, 막혀 있으면 임시 입력칸으로 대신한다.
  function copyText(text) {
    function fallback() {
      var ta = el("textarea", { value: text });
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      return ok ? Promise.resolve() : Promise.reject(new Error("복사하지 못했습니다. 문구를 직접 선택해서 복사해 주세요."));
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).catch(fallback);
    }
    return fallback();
  }

  function renderCaptions(captions, model) {
    resultEl.innerHTML = "";
    captions.forEach(function (text, i) {
      var btn = el("button", { type: "button", className: "ghost", textContent: "복사" });
      btn.addEventListener("click", function () {
        copyText(text).then(function () {
          say("");
          btn.textContent = "복사됨";
          setTimeout(function () { btn.textContent = "복사"; }, 1500);
        }).catch(function (err) {
          say(friendly(err, "복사하지 못했습니다. 문구를 직접 선택해서 복사해 주세요."), true);
        });
      });
      resultEl.appendChild(el("div", { className: "caption" }, [
        el("div", { className: "no", textContent: "문구 " + (i + 1) }),
        el("p", { textContent: text }),
        btn
      ]));
    });
    resultEl.appendChild(el("div", { className: "model", textContent: "만든 AI: " + model }));
  }

  function loadMenus() {
    return fetch(SUPABASE_URL + "/rest/v1/menus?select=id,name&order=id.asc", { headers: headers() })
      .then(readJson)
      .then(function (list) {
        list = list || [];
        menuSel.innerHTML = "";
        list.forEach(function (m) {
          menuSel.appendChild(el("option", { value: m.name, textContent: m.name }));
        });
        if (!list.length) {
          menuSel.appendChild(el("option", { value: "", textContent: "등록된 메뉴가 없습니다" }));
          goBtn.disabled = true;
          say("먼저 '메뉴' 화면에서 메뉴를 등록해 주세요.", true);
        }
      })
      .catch(function (err) {
        say("메뉴 목록을 불러오지 못했습니다. " +
          friendly(err, "화면을 새로고침한 뒤 다시 시도해 주세요."), true);
        goBtn.disabled = true;
      });
  }

  document.getElementById("promo-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var menu = menuSel.value;
    var mood = document.querySelector('input[name="mood"]:checked').value;
    if (!menu) { say("메뉴를 선택해 주세요.", true); return; }

    goBtn.disabled = true;
    goBtn.textContent = "만드는 중";
    say("AI가 문구를 쓰고 있습니다. 최대 1분 정도 걸릴 수 있습니다.");
    hintEl.style.display = "none";

    fetch(AI_URL, {
      method: "POST",
      headers: headers(),
      body: JSON.stringify({ type: "promo", menu: menu, mood: MOOD_TEXT[mood], model: selectedModel() })
    }).then(readJson).then(function (ai) {
      if (!ai || !Array.isArray(ai.captions) || ai.captions.length < 3) {
        throw new Error("AI 답변을 읽지 못했습니다.");
      }
      renderCaptions(ai.captions, ai.model);
      say("");
    }).catch(function (err) {
      say("문구를 만들지 못했습니다. " + friendly(err, "잠시 후 다시 눌러 주세요."), true);
      if (!resultEl.children.length) { hintEl.style.display = ""; }
    }).then(function () {
      goBtn.disabled = false;
      goBtn.textContent = "문구 만들기";
    });
  });

  loadMenus();
</script>
</body>
</html>
