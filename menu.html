<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>메뉴 · 골목카페</title>
<style>
  :root {
    --bg: #fbf6ef;
    --panel: #ffffff;
    --side: #4a2f1f;
    --side-text: #f3e6d6;
    --accent: #c97b3c;
    --text: #2d1f16;
    --muted: #8a7566;
    --line: #e8dccd;
    --font: "Pretendard", "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", sans-serif;
    --danger: #b3402a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 28px;
    font-family: var(--font);
    color: var(--text);
    background: var(--bg);
  }
  .wrap { max-width: 1000px; }
  h1 { margin: 0 0 4px; font-size: 24px; }
  .sub { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 20px; }
  .box h2 { margin: 0 0 14px; font-size: 17px; }

  form { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
  label { display: flex; flex-direction: column; font-size: 13px; color: var(--muted); gap: 4px; }
  input, select {
    font: inherit; color: var(--text);
    padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff;
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #f-name { width: 190px; }
  #f-category { width: 130px; }
  #f-price, #f-stock { width: 110px; }
  button {
    font: inherit; font-weight: 700; cursor: pointer;
    padding: 10px 18px; border: 0; border-radius: 8px; background: var(--accent); color: #fff;
  }
  button:disabled { opacity: .6; cursor: default; }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); font-size: 15px; }
  th { color: var(--muted); font-size: 13px; font-weight: 500; }
  td input { width: 100px; padding: 7px 8px; }
  tr.low td.stock-cell input { color: var(--danger); border-color: var(--danger); font-weight: 700; }
  tr.low .name { color: var(--danger); font-weight: 700; }
  .badge { margin-left: 8px; font-size: 12px; color: var(--danger); }
  .saved { color: var(--muted); font-size: 13px; }
  .empty { color: var(--muted); padding: 18px 8px; }
  #msg { min-height: 20px; margin: 0 0 12px; font-size: 14px; }
  #msg.error { color: var(--danger); }
  .unit { color: var(--muted); margin-left: 4px; font-size: 13px; }

  @media (max-width: 600px) {
    body { padding: 16px; }
    #f-name, #f-category, #f-price, #f-stock { width: 100%; }
    label { width: 100%; }
    th:nth-child(2), td:nth-child(2) { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>메뉴 · 재고</h1>
  <p class="sub">재고가 5개 이하인 메뉴는 빨간색으로 보입니다. 가격이나 재고를 고치고 칸 밖을 누르면 저장됩니다.</p>
  <p id="msg"></p>

  <div class="box">
    <h2>메뉴 추가</h2>
    <form id="add-form">
      <label>메뉴 이름
        <input id="f-name" type="text" required maxlength="40" placeholder="예) 아메리카노">
      </label>
      <label>분류
        <select id="f-category">
          <option>커피</option>
          <option>음료</option>
          <option>디저트</option>
          <option>기타</option>
        </select>
      </label>
      <label>가격 (원)
        <input id="f-price" type="number" min="0" step="100" required placeholder="4500">
      </label>
      <label>재고 (개)
        <input id="f-stock" type="number" min="0" step="1" required placeholder="20">
      </label>
      <button type="submit" id="add-btn">추가</button>
    </form>
  </div>

  <div class="box">
    <h2>메뉴 목록</h2>
    <table>
      <thead>
        <tr><th>메뉴</th><th>분류</th><th>가격</th><th>재고</th><th></th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty" class="empty" style="display:none">아직 등록된 메뉴가 없습니다. 위에서 첫 메뉴를 추가해 보세요.</div>
  </div>
</div>

<script>
  var SUPABASE_URL = "https://aygdylhsmzevjrybnozf.supabase.co";
  var SUPABASE_KEY = "sb_publishable_EHyev6fOsOQbrASk6X79vw_uJh4dKcY";
  var LOW_STOCK = 5;

  var rowsEl = document.getElementById("rows");
  var emptyEl = document.getElementById("empty");
  var msgEl = document.getElementById("msg");

  function api(path, options) {
    options = options || {};
    options.headers = Object.assign({
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json"
    }, options.headers || {});
    return fetch(SUPABASE_URL + "/rest/v1/" + path, options).then(function (res) {
      if (!res.ok) {
        return res.text().then(function (t) { throw new Error(t || res.statusText); });
      }
      // 저장 요청은 응답 본문이 비어 있을 수 있다.
      return res.text().then(function (t) { return t ? JSON.parse(t) : null; });
    });
  }

  function say(text, isError) {
    msgEl.textContent = text || "";
    msgEl.className = isError ? "error" : "";
  }

  function el(tag, props, children) {
    var e = document.createElement(tag);
    Object.keys(props || {}).forEach(function (k) { e[k] = props[k]; });
    (children || []).forEach(function (c) {
      e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return e;
  }

  function renderRow(menu) {
    var tr = el("tr");
    var nameCell = el("td", {}, [el("span", { className: "name", textContent: menu.name })]);
    var badge = el("span", { className: "badge", textContent: "재고 부족" });
    nameCell.appendChild(badge);

    var priceInput = el("input", { type: "number", min: 0, step: 100, value: menu.price });
    var stockInput = el("input", { type: "number", min: 0, step: 1, value: menu.stock });
    var status = el("span", { className: "saved" });

    function refreshLow() {
      var low = Number(stockInput.value) <= LOW_STOCK;
      tr.className = low ? "low" : "";
      badge.style.display = low ? "inline" : "none";
    }

    function save(field, input) {
      var value = Number(input.value);
      if (input.value === "" || !Number.isInteger(value) || value < 0) {
        input.value = menu[field];
        refreshLow();
        say("0 이상의 정수만 입력할 수 있습니다.", true);
        return;
      }
      if (value === menu[field]) { return; }
      var body = {};
      body[field] = value;
      status.textContent = "저장 중…";
      api("menus?id=eq." + menu.id, {
        method: "PATCH",
        headers: { "Prefer": "return=minimal" },
        body: JSON.stringify(body)
      }).then(function () {
        menu[field] = value;
        status.textContent = "저장됨";
        say("");
        setTimeout(function () { status.textContent = ""; }, 1500);
      }).catch(function (err) {
        input.value = menu[field];
        refreshLow();
        status.textContent = "";
        say("저장하지 못했습니다: " + err.message, true);
      });
    }

    priceInput.addEventListener("change", function () { save("price", priceInput); });
    stockInput.addEventListener("input", refreshLow);
    stockInput.addEventListener("change", function () { save("stock", stockInput); });

    tr.appendChild(nameCell);
    tr.appendChild(el("td", { textContent: menu.category }));
    tr.appendChild(el("td", {}, [priceInput, el("span", { className: "unit", textContent: "원" })]));
    var stockCell = el("td", { className: "stock-cell" }, [stockInput, el("span", { className: "unit", textContent: "개" })]);
    tr.appendChild(stockCell);
    tr.appendChild(el("td", {}, [status]));
    refreshLow();
    return tr;
  }

  function load() {
    return api("menus?select=*&order=id.asc").then(function (menus) {
      rowsEl.innerHTML = "";
      menus.forEach(function (m) { rowsEl.appendChild(renderRow(m)); });
      emptyEl.style.display = menus.length ? "none" : "block";
    }).catch(function (err) {
      say("메뉴를 불러오지 못했습니다: " + err.message, true);
    });
  }

  document.getElementById("add-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var btn = document.getElementById("add-btn");
    var name = document.getElementById("f-name").value.trim();
    var price = Number(document.getElementById("f-price").value);
    var stock = Number(document.getElementById("f-stock").value);
    if (!name) { say("메뉴 이름을 입력해 주세요.", true); return; }
    if (!Number.isInteger(price) || price < 0 || !Number.isInteger(stock) || stock < 0) {
      say("가격과 재고는 0 이상의 정수로 입력해 주세요.", true);
      return;
    }
    btn.disabled = true;
    api("menus", {
      method: "POST",
      headers: { "Prefer": "return=minimal" },
      body: JSON.stringify({
        name: name,
        category: document.getElementById("f-category").value,
        price: price,
        stock: stock
      })
    }).then(function () {
      e.target.reset();
      say("'" + name + "' 메뉴를 추가했습니다.");
      return load();
    }).catch(function (err) {
      say("추가하지 못했습니다: " + err.message, true);
    }).then(function () {
      btn.disabled = false;
    });
  });

  load();
</script>
</body>
</html>
